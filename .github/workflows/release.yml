name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
      id-token: write
    env:
      # Prefer a dedicated PAT for release automation:
      # - avoids the repo setting that can block PR creation with the default GITHUB_TOKEN
      # - allows CI to run on the version PR (PRs created with GITHUB_TOKEN often won't trigger workflows)
      #
      # Create a repo secret named RELEASE_GITHUB_TOKEN with PR write access.
      GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test:unit

      - name: Create version PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          commit: 'chore: version packages'
          title: 'chore: version packages'
          createGithubReleases: false

      - name: Publish to npm
        if: steps.changesets.outputs.hasChangesets == 'false'
        id: publish
        run: pnpm release
        env:
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Resolve release version
        if: steps.publish.conclusion == 'success'
        id: version
        run: |
          VERSION=$(node -p "require('./packages/client/package.json').version")
          LAG_VERSION=$(node -p "require('./packages/lag/package.json').version")
          if [ "$VERSION" != "$LAG_VERSION" ]; then
            echo "::error::@kafkats/lag ($LAG_VERSION) is out of lockstep with @kafkats/client ($VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # A main-branch push without changesets still runs `pnpm release` (a no-op publish), so the
      # publish step alone cannot tell a release from an ordinary commit. The version tag can: it is
      # created exactly once, and everything downstream (image, GitHub release) is gated on that.
      - name: Create annotated git tag
        if: steps.publish.conclusion == 'success'
        id: tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git fetch --tags --quiet
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists; skipping."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: steps.tag.outputs.created == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.tag.outputs.created == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.tag.outputs.created == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish lag exporter image
        if: steps.tag.outputs.created == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/lag/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/chrisrecalis/kafkats-lag:${{ steps.version.outputs.version }}
            ghcr.io/chrisrecalis/kafkats-lag:latest
          labels: |
            org.opencontainers.image.source=https://github.com/chrisrecalis/kafkats
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Create GitHub release
        if: steps.tag.outputs.created == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
