name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint-format:
        name: Lint & Format
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run lint
              run: pnpm lint

            - name: Check formatting
              run: pnpm format:check

    typecheck:
        name: Type Check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Type check all packages
              run: pnpm typecheck

    unit-tests:
        name: Unit Tests
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                package:
                    - client
                    - flow
                    - lag
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run unit tests (${{ matrix.package }})
              run: pnpm turbo run test:unit --filter=@kafkats/${{ matrix.package }}

    integration-tests:
        name: Integration Tests
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                package:
                    - client
                    - flow
                    - lag
        services:
            docker:
                image: docker:dind
                options: --privileged
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run integration tests (${{ matrix.package }})
              run: pnpm turbo run test:integration --filter=@kafkats/${{ matrix.package }}
              env:
                  KAFKA_TS_LOG_LEVEL: warn
                  VITEST_MAX_WORKERS: 1

    docker-image:
        name: Lag Exporter Image
        runs-on: ubuntu-latest
        # Only when the build itself changes; code changes are covered by the test jobs
        if: github.event_name == 'pull_request'
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Detect image-relevant changes
              id: changes
              uses: dorny/paths-filter@v3
              with:
                  filters: |
                      image:
                          - 'packages/lag/Dockerfile'
                          - 'packages/lag/package.json'
                          - 'packages/client/package.json'
                          - '.dockerignore'
                          - '.npmrc'
                          - 'package.json'
                          - 'pnpm-lock.yaml'
                          - 'pnpm-workspace.yaml'
                          - 'turbo.json'

            - name: Set up Docker Buildx
              if: steps.changes.outputs.image == 'true'
              uses: docker/setup-buildx-action@v3

            - name: Build image
              if: steps.changes.outputs.image == 'true'
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: packages/lag/Dockerfile
                  push: false
                  load: true
                  tags: kafkats-lag:ci
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Smoke test image
              if: steps.changes.outputs.image == 'true'
              run: docker run --rm kafkats-lag:ci --help
